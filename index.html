<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭医疗记录工作台</title>
<style>
  :root{
    --accent:#16a34a; --accent-dark:#15803d; --accent-soft:#f0fdf4;
    --bg:#f6faf6; --card:#ffffff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --danger:#ef4444;
    --shadow:0 1px 2px rgba(0,0,0,.04); --radius:16px;
  }
  html[data-theme="forest"]{--accent:#16a34a;--accent-dark:#15803d;--accent-soft:#f0fdf4;}
  html[data-theme="blue"]{--accent:#3b82f6;--accent-dark:#1d4ed8;--accent-soft:#eff6ff;}
  html[data-theme="purple"]{--accent:#8b5cf6;--accent-dark:#6d28d9;--accent-soft:#f5f3ff;}
  html[data-theme="rose"]{--accent:#f43f5e;--accent-dark:#be123c;--accent-soft:#fff1f2;}
  html[data-theme="amber"]{--accent:#f59e0b;--accent-dark:#b45309;--accent-soft:#fffbeb;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;padding-bottom:60px;}
  header{background:var(--bg);padding:18px 24px 6px;}
  header h1{font-size:22px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px;}
  header h1::before{content:"🩺";}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px;}
  .top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end;}
  .btn{border:1px solid var(--border);background:var(--card);color:var(--text);padding:8px 14px;
    border-radius:10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(.95);}
  .btn.ghost{border:none;background:transparent;}
  .container{max-width:1280px;margin:0 auto;padding:0 24px;}

  .member-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .member-card .avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;font-size:24px;}
  .member-card .info{flex:1;}
  .member-card .name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;}
  .member-card .count{font-weight:400;color:var(--muted);font-size:12px;}
  .member-card .edit-icon{color:var(--muted);cursor:pointer;border:none;background:none;padding:4px;}

  .profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;margin-bottom:14px;}
  .profile-row{display:flex;gap:24px;flex-wrap:wrap;align-items:center;font-size:13px;}
  .profile-row .lbl{color:var(--muted);margin-right:4px;}
  .profile-row .val{color:var(--text);font-weight:600;}
  .profile-row .edit-link{color:var(--accent);cursor:pointer;background:none;border:none;padding:0;margin-left:auto;font-size:13px;}
  .hosp-line{margin-top:8px;color:var(--text);font-size:13px;}
  .hosp-line .lbl{color:var(--muted);margin-right:6px;}

  .file-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;margin-bottom:14px;}
  .file-card .head{display:flex;align-items:center;justify-content:space-between;}
  .file-card .head .title{display:flex;align-items:center;gap:6px;font-weight:500;}
  .file-card .hint{color:var(--muted);font-size:12px;margin-top:8px;}
  #filesList{margin-top:8px;}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
  .stat .num{font-size:28px;font-weight:700;}
  .stat .lbl{color:var(--muted);font-size:13px;margin-top:2px;}
  .stat-add{background:var(--card);border:2px dashed var(--border);border-radius:var(--radius);
    padding:16px 18px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
  .stat-add:hover{border-color:var(--accent);color:var(--accent);}

  .main{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start;}
  @media(max-width:980px){.main{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,1fr);}}

  .form-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .form-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .form-card .who{color:var(--muted);font-size:13px;}

  input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
    font-size:13px;font-family:inherit;background:#fff;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .chart-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .chart-card .meta{color:var(--muted);font-size:12px;}
  .chart-card .meta a,.chart-card .meta button{color:var(--accent);cursor:pointer;background:none;border:none;padding:0;font-size:12px;}
  .chart-legend{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;}
  .chart-legend .lg{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;color:var(--muted);}
  .chart-legend .lg .sw{width:10px;height:10px;border-radius:50%;}
  .chart-legend .lg.off{opacity:.4;text-decoration:line-through;}

  .timeline-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-top:14px;}
  .timeline-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .timeline-filter{padding:7px 12px;border:1px solid var(--border);border-radius:9px;font-size:13px;background:#fff;}

  .record{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card);}
  .record .rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .record .rtag{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--accent-soft);
    color:var(--accent);font-size:12px;font-weight:600;margin-right:8px;}
  .record .rdate{color:var(--muted);font-size:13px;}
  .record .del-btn{color:var(--muted);background:none;border:none;cursor:pointer;font-size:12px;}
  .record .del-btn:hover{color:var(--danger);}
  .kv{display:flex;gap:6px;margin:2px 0;}
  .kv .k{color:var(--muted);min-width:70px;}
  /* 输血分行 */
  .tf-line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;gap:12px;}
  .tf-line .tf-lbl{color:var(--muted);}
  .tf-line .tf-val{font-weight:600;color:var(--text);}
  .tf-line.sum{border-top:1px dashed var(--border);margin-top:4px;padding-top:7px;font-weight:700;color:var(--accent-dark);}
  .tf-line.count{color:var(--muted);font-size:13px;}
  .tf-line.count .tf-val{color:var(--text);font-weight:600;}
  .empty{color:var(--muted);text-align:center;padding:32px 0;font-size:13px;}
  .chart-svg-wrap{width:100%;}
  .chart-empty{height:120px;display:flex;align-items:center;justify-content:center;color:var(--muted);}

  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal-mask.open{display:flex;}
  .modal{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>家庭医疗记录工作台</h1>
    <div class="sub">为家人记录就诊、治疗与体征 · 数据仅存本地，可导出备份</div>
    <div class="top-actions">
      <button class="btn" id="btnExportExcel">📊 导出 Excel</button>
      <button class="btn" id="btnExportJson">⬇ 导出 JSON</button>
      <button class="btn" id="btnImport">⬆ 导入备份</button>
      <button class="btn" id="btnAddMember">＋ 添加成员</button>
      <button class="btn" id="btnTheme">🎨 主题</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
  </div>
</header>

<div class="container">
  <div id="memberTop"></div>

  <div class="file-card">
    <div class="head">
      <div class="title">📎 医疗文件照片 / PDF</div>
      <button class="btn" id="btnUpload">＋ 上传</button>
      <input type="file" id="fileUpload" accept="image/*,application/pdf" multiple style="display:none">
    </div>
    <div id="filesList"></div>
    <div class="hint">支持图片和 PDF。文件保存在本机浏览器，建议定期导出备份。</div>
  </div>

  <div class="stats" id="statGrid"></div>

  <div class="main">
    <div class="form-card">
      <div class="head">
        <div style="font-weight:600;">新增记录</div>
        <div class="who">· <b id="curMemberName">—</b></div>
      </div>
      <div class="form-row">
        <label>记录类型</label>
        <select id="selType">
          <option>输血记录</option>
          <option>化疗记录</option>
          <option>看诊预约</option>
          <option>CBC血常规</option>
          <option>血报告</option>
          <option>体征测量</option>
          <option>用药记录</option>
          <option>医疗费用</option>
          <option>住院记录</option>
          <option>其他</option>
        </select>
      </div>
      <div id="formFields"></div>
      <button class="btn primary" id="btnSaveRecord" style="width:100%;margin-top:8px;padding:11px;">保存记录</button>
    </div>

    <div class="chart-card">
      <div class="head">
        <div style="font-weight:600;">趋势图</div>
        <div class="meta">单位不同，分图展示 · 点图例可隐藏 · <button id="btnCfgChart">⚙ 配置图表</button></div>
      </div>
      <div id="charts" class="chart-svg-wrap"></div>
      <div class="chart-legend" id="chartLegend"></div>
    </div>
  </div>

  <div class="timeline-card">
    <div class="head">
      <div style="font-weight:600;">记录时间线</div>
      <select class="timeline-filter" id="tlFilter">
        <option value="全部">全部</option>
        <option>输血记录</option>
        <option>化疗记录</option>
        <option>看诊预约</option>
        <option>CBC血常规</option>
        <option>血报告</option>
        <option>体征测量</option>
        <option>用药记录</option>
        <option>医疗费用</option>
        <option>住院记录</option>
        <option>其他</option>
      </select>
    </div>
    <div id="recordList"></div>
  </div>
</div>

<!-- 添加/编辑成员 -->
<div class="modal-mask" id="memberModal">
  <div class="modal">
    <h3 id="memberModalTitle">添加家庭成员</h3>
    <div class="form-row"><label>姓名</label><input id="mName"></div>
    <div class="form-row"><label>关系（可选）</label><input id="mRel" placeholder="如 祖父 / 母亲"></div>
    <div class="form-row"><label>医院清单（可添加多家，含电话号码）</label>
      <div id="hospitalList"></div>
      <button class="btn ghost" id="btnAddHospital" style="color:var(--accent);padding-left:0;">＋ 添加医院</button>
    </div>
    <div class="row2">
      <div class="form-row"><label>出生日期</label><input id="mDob" type="date"></div>
      <div class="form-row"><label>血型</label>
        <select id="mBlood"><option value="">—</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option></select>
      </div>
    </div>
    <div class="row2">
      <div class="form-row"><label>体重 (kg)</label><input id="mWeight" type="number" step="0.1"></div>
      <div class="form-row"><label>身高 (cm)</label><input id="mHeight" type="number" step="0.1"></div>
    </div>
    <div class="form-row"><label>头像 emoji（可选）</label><input id="mEmoji" placeholder="如 👴 👵 👶"></div>
    <div class="modal-actions">
      <button class="btn" data-close="memberModal">取消</button>
      <button class="btn primary" id="btnSaveMember">保存</button>
    </div>
  </div>
</div>

<!-- 主题 -->
<div class="modal-mask" id="themeModal">
  <div class="modal">
    <h3>选择主题色</h3>
    <div style="display:flex;flex-wrap:wrap;gap:8px;" id="themeGrid"></div>
    <div class="modal-actions"><button class="btn" data-close="themeModal">关闭</button></div>
  </div>
</div>

<!-- 配置图表 -->
<div class="modal-mask" id="chartModal">
  <div class="modal">
    <h3>配置图表系列</h3>
    <p style="color:var(--muted);font-size:12px;margin:0 0 10px;">不同记录类型提供不同的数值字段。每个成员独立保存。</p>
    <div id="seriesList"></div>
    <button class="btn ghost" id="btnAddSeries" style="color:var(--accent);padding-left:0;">＋ 添加系列</button>
    <div class="modal-actions">
      <button class="btn" data-close="chartModal">关闭</button>
      <button class="btn primary" id="btnSaveSeries">保存配置</button>
    </div>
  </div>
</div>

<!-- 导出选择 -->
<div class="modal-mask" id="exportModal">
  <div class="modal">
    <h3>📊 导出 Excel — 选择内容</h3>
    <div class="form-row"><label>成员范围</label>
      <select id="expScope"><option value="current">仅当前成员</option><option value="all">全部成员</option></select>
    </div>
    <div class="form-row"><label>记录类型</label>
      <div id="expTypes" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" data-close="exportModal">取消</button>
      <button class="btn primary" id="btnDoExport">导出 Excel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 数据层：兼容用户原版 schema ===== */
const STORE_KEY='family_medical_v3';
const TYPES=['输血记录','化疗记录','看诊预约','CBC血常规','血报告','体征测量','用药记录','医疗费用','住院记录','其他'];
const THEMES=[['forest','🌲 森林绿'],['blue','🔵 蓝'],['purple','🟣 紫'],['rose','🔴 玫红'],['amber','🟠 橙']];

let state=load();
function load(){
  try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&d.members)return d;}catch(e){}
  const def=defaultState(); def.current=def.members[0].id; return def;
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}
// 首次无数据时的默认结构（用户导入后会覆盖）
function defaultState(){
  return {members:[{id:'m'+Date.now(),name:'',emoji:'🧑',dob:'',blood:'',weight:'',height:'',hospitals:[],files:[],chartSeries:[]}],
    records:[],current:null,theme:'forest'};
}
const uid=()=>'r'+Date.now()+Math.floor(Math.random()*1000);
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n)=>(n===null||n===undefined||n==='')?'—':n;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
const curMember=()=>state.members.find(m=>m.id===state.current);

/* ===== 头部 & 成员卡 ===== */
function renderMemberTop(){
  const m=curMember(); const top=$('#memberTop'); top.innerHTML='';
  if(!m){top.innerHTML='<div class="empty">请先添加家庭成员</div>';return;}
  const card=document.createElement('div'); card.className='member-card';
  card.innerHTML=`<div class="avatar">${esc(m.emoji||'🧑')}</div>
    <div class="info"><div class="name">${esc(m.name)} ${m.rel?`<span class="count">（${esc(m.rel)}）</span>`:''} <span class="count">${(state.records||[]).filter(r=>r.member===m.id).length} 条记录</span></div></div>
    <button class="edit-icon" id="btnEditMember" title="编辑资料">✎</button>`;
  top.appendChild(card);
  const age=m.dob?calcAge(m.dob):null;
  const profile=document.createElement('div'); profile.className='profile-card';
  const bmi=(m.weight&&m.height)?Math.round(m.weight/((m.height/100)**2)*10)/10:null;
  profile.innerHTML=`<div class="profile-row">
    <span><span class="lbl">出生</span><span class="val">${esc(m.dob||'—')}${age?`（${age} 岁）`:''}</span></span>
    <span><span class="lbl">血型</span><span class="val">${esc(m.blood||'—')}</span></span>
    <span><span class="lbl">体重</span><span class="val">${esc(m.weight||'—')}${m.weight?' kg':''}</span></span>
    <span><span class="lbl">身高</span><span class="val">${esc(m.height||'—')}${m.height?' cm':''}</span></span>
    <span><span class="lbl">BMI</span><span class="val">${esc(bmi||'—')}</span></span>
    <button class="edit-link" id="btnEditProfile">编辑资料</button></div>
  ${(m.hospitals&&m.hospitals.length)?`<div class="hosp-line"><span class="lbl">常用医院：</span>${m.hospitals.map(h=>`${esc(h.name)}${h.phone?` · ${esc(h.phone)}`:''}`).join('  |  ')}</div>`:''}`;
  top.appendChild(profile);
  $('#btnEditMember').onclick=$('#btnEditProfile').onclick=()=>openMemberModal(m);
}
function calcAge(birth){const b=new Date(birth),now=new Date();let a=now.getFullYear()-b.getFullYear();const m=now.getMonth()-b.getMonth();if(m<0||(m===0&&now.getDate()<b.getDate()))a--;return a;}

/* ===== 文件 ===== */
function renderFiles(){
  const m=curMember(); const box=$('#filesList'); box.innerHTML='';
  if(!m||!m.files||!m.files.length)return;
  m.files.forEach(f=>{
    const a=document.createElement('div');a.style.cssText='display:flex;gap:6px;align-items:center;margin:4px 0;font-size:13px;';
    const isImg=f.type&&f.type.startsWith('image/');
    a.innerHTML=`<span>${isImg?'🖼️':'📄'}</span><a href="${f.data}" target="_blank" style="color:var(--accent);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(f.name)}</a><button class="btn ghost" style="padding:2px 8px;color:var(--danger);">✕</button>`;
    a.querySelector('button').onclick=()=>{m.files=m.files.filter(x=>x.id!==f.id);save();renderFiles();};
    box.appendChild(a);
  });
}

/* ===== 统计（用原版逻辑） ===== */
function renderStats(){
  const m=curMember(); const g=$('#statGrid'); g.innerHTML='';
  if(!m)return;
  const recs=state.records.filter(r=>r.member===m.id);
  const trans=recs.filter(r=>r.type==='输血记录');
  const chemo=recs.filter(r=>r.type==='化疗记录');
  const totalBags=trans.reduce((s,r)=>s+((r.trans&&r.trans.bags)?r.trans.bags.length:0),0);
  const totalMl=trans.reduce((s,r)=>s+((r.trans&&r.trans.bags)?r.trans.bags.reduce((a,b)=>a+(+b||0),0):0),0);
  const base=[
    {val:chemo.length,lbl:'化疗总周期'},
    {val:Math.round(totalMl),lbl:'输血总 ml'},
    {val:totalBags,lbl:'输血总袋数'}
  ];
  [...base].forEach(s=>{
    const d=document.createElement('div');d.className='stat';
    d.innerHTML=`<div class="num">${fmt(s.val)}</div><div class="lbl">${esc(s.lbl)}</div>`;g.appendChild(d);
  });
  const add=document.createElement('div');add.className='stat-add';add.textContent='＋ 自定义';
  add.onclick=toast('自定义统计可后续添加');g.appendChild(add);
}

/* ===== 表单（按原版字段） ===== */
let selType='输血记录';
function renderSelType(){
  const s=$('#selType');
  s.value=selType;
  s.onchange=()=>{selType=s.value;renderForm();};
}
function renderForm(){
  const box=$('#formFields'); let html='';
  if(selType==='输血记录'){

function renderRecords(){

  const recs=state.records.filter(r=>r.member===m.id&&(tlFilter==='全部'||r.type===tlFilter))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!recs.length){box.innerHTML='<div class="empty">暂无记录，从左侧添加第一条吧</div>';return;}
  recs.forEach(r=>box.appendChild(renderRecordCard(r)));
}
function renderRecordCard(r){
  const d=document.createElement('div'); d.className='record';
  let body='';
  if(r.type==='输血记录'){body=renderTransfusion(r);}
  else if(r.type==='化疗记录'){
    body=fieldsToHtml([['药物',r.drug],['周期',r.cycle],['周期天数',r.cycleDays],['起',r.startDate],['止',r.endDate]]);
  } else if(r.type==='看诊预约'){
    const v=r.visit||{}; body=fieldsToHtml([['医生',v.doctor],['科室',v.dept],['医院',v.hospital]]);
    if(r.time)body+=`<div class="kv"><span class="k">时间</span><span>${esc(r.time)}</span></div>`;
  } else if(r.type==='CBC血常规'){
    const c=r.cbc||{}; body=fieldsToHtml([['HGB',c.cHgb],['PLT',c.cPlt],['HCT',c.cHct],['NEUT',c.cNeut]]);
  } else if(r.type==='血报告'){
    body=fieldsToHtml([['报告',r.title],['来源',r.src],['结论',r.note]]);
  } else if(r.type==='用药记录'){
    body=fieldsToHtml([['药名',r.drug],['剂量',r.dose],['频次',r.freq],['备注',r.note]]);
  } else if(r.type==='医疗费用'){
    body=fieldsToHtml([['金额',r.amount?(r.amount+' '+(r.currency||'')).trim():''],['项目',r.item],['医院',r.hospital],['备注',r.note]]);
  } else if(r.type==='其他'){
    body=`<div style="white-space:pre-wrap;">${esc(r.note||'')}</div>`;
  } else if(r.type==='体征测量'){
    const v=r.vitals||{}; body=fieldsToHtml([['血压',v.bp],['体温',v.temp],['心率',v.hr],['血氧',v.spo2]]);
  } else if(r.type==='住院记录'){
    body=fieldsToHtml([['原因',r.title],['病房',r.ward],['医院',r.hospital],['起',r.startDate],['止',r.endDate]]);
  } else { body=''; }
  d.innerHTML=`<div class="rhead"><div><span class="rtag">${esc(r.type)}</span>
    <span class="rdate">${esc(r.date||'')}</span></div>
    <button class="del-btn" data-edit="${r.id}" style="margin-right:6px;">编辑</button>
    <button class="del-btn" data-del="${r.id}">删除</button></div><div>${body}</div>`;
  d.querySelector('[data-del]').onclick=()=>{if(confirm('删除这条记录？')){state.records=state.records.filter(x=>x.id!==r.id);save();renderAll();}};
  d.querySelector('[data-edit]').onclick=()=>enterEditMode(r);
  return d;
}

let editingRec=null;
function enterEditMode(r){

    if(r.date){const el=document.getElementById('f_date');if(el)el.value=r.date;}

    if(r.type==='输血记录'&&r.trans){
      const box=$('#bagsBox'); if(box){
        box.innerHTML='';
        (r.trans.bags||[]).forEach(ml=>{
          const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;margin-bottom:6px;';
          row.innerHTML=`<input type="number" step="0.01" value="${ml}" class="bag-ml" style="flex:1;"><button class="btn ghost" style="color:var(--danger);padding:4px 8px;">✕</button>`;
          row.querySelector('button').onclick=()=>row.remove();box.appendChild(row);
        });
        if(!box.children.length){const r2=document.createElement('div');r2.style.cssText='display:flex;gap:6px;margin-bottom:6px;';r2.innerHTML=`<input type="number" step="0.01" placeholder="每袋毫升" class="bag-ml" style="flex:1;"><button class="btn ghost" style="color:var(--danger);padding:4px 8px;">✕</button>`;r2.querySelector('button').onclick=()=>r2.remove();box.appendChild(r2);}
      }
    }
    const fields=['start','end','drug','cycle','cycleDays','doctor','dept','hospital','hgb','plt','hct','neut','bp','temp','hr','spo2','reason','ward','title','src','dose','freq','amount','item','note'];
    fields.forEach(k=>{
      const el=document.getElementById('f_'+k);
      let v;
      if(k==='doctor'||k==='dept'||k==='hospital') v=(r.visit&&r.visit[k])||'';
      else if(k==='hgb'||k==='plt'||k==='hct'||k==='neut') v=(r.cbc&&r.cbc['c'+k.charAt(0).toUpperCase()+k.slice(1)])||'';
      else v=r[k];
      if(el&&v!=null) el.value=v;
    });
    const sel=$('#f_currency'); if(sel&&r.currency) sel.value=r.currency;
  },50);
  $('#btnSaveRecord').textContent='保存修改';
  toast('编辑模式：修改后点「保存修改」');
}
function fieldsToHtml(pairs){
  return pairs.filter(p=>p[1]).map(p=>`<div class="kv"><span class="k">${esc(p[0])}</span><span>${esc(p[1])}</span></div>`).join('')||'<div style="color:var(--muted);">无内容</div>';
}
/* 输血：每袋 / 合计 / 袋数 各占一行 */
function renderTransfusion(r){
  const bags=(r.trans&&r.trans.bags)||[];
  const lines=bags.map((b,i)=>`<div class="tf-line"><span class="tf-lbl">第${i+1}袋</span><span class="tf-val">${esc(b)} ml</span></div>`).join('');
  const total=bags.reduce((s,b)=>s+(+b||0),0);
  const sumLine=`<div class="tf-line sum"><span class="tf-lbl">合计</span><span class="tf-val">${esc(Math.round(total*100)/100)} ml</span></div>`;
  const countLine=`<div class="tf-line count"><span class="tf-lbl">袋数</span><span class="tf-val">${bags.length}</span></div>`;
  return `<div>${lines}${sumLine}${countLine}</div>`;
}

/* ===== 趋势图 ===== */
function renderCharts(){
  const m=curMember(); const box=$('#charts'); box.innerHTML=''; const legend=$('#chartLegend'); legend.innerHTML='';
  if(!m)return;
  const series=(m.chartSeries||[]);
  if(!series.length){box.innerHTML='<div class="chart-empty">还没有可绘图的记录。点「⚙ 配置图表」选一个数据源，或先添加 CBC血常规 / 输血记录。</div>';return;}
  const byType={};
  series.forEach(s=>{(byType[s.type]=byType[s.type]||[]).push(s);});
  Object.entries(byType).forEach(([type,ss])=>{
    const recs=state.records.filter(r=>r.member===m.id&&r.type===type).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(!recs.length)return;
    box.insertAdjacentHTML('beforeend',buildLineChart(recs,ss,type));
    ss.forEach(s=>{const lg=document.createElement('div');lg.className='lg';
      lg.innerHTML=`<span class="sw" style="background:${s.color}"></span>${esc(s.label)}`;legend.appendChild(lg);});
  });
  if(!box.children.length)box.innerHTML='<div class="chart-empty">所选系列暂无对应数据。</div>';
}
function cbcVal(r,field){const c=r.cbc||{};const k=field.split('.').pop();return +(c[k]??0)||0;}
function buildLineChart(recs,ss,type){
  const W=720,H=260,padL=40,padR=20,padT=20,padB=30;
  const allPts={}; let maxV=0;
  ss.forEach(s=>{allPts[s.label]=recs.map(r=>{
    let v=0;
    if(type==='输血记录') v=(r.trans&&r.trans.bags)?r.trans.bags.reduce((a,b)=>a+(+b||0),0):0;
    else if(type==='CBC血常规') v=cbcVal(r,s.field);
    else v=0;
    return {x:r.date,v};
  });allPts[s.label].forEach(p=>{if(p.v>maxV)maxV=p.v;});});
  if(maxV===0)maxV=1;
  const n=recs.length;
  const x=i=>n<=1?padL+(W-padL-padR)/2:padL+i*(W-padL-padR)/(n-1);
  const y=v=>H-padB-(v/maxV)*(H-padT-padB);
  let paths='';
  ss.forEach(s=>{const pts=allPts[s.label];if(!pts.length)return;
    const dpath=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    paths+=`<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    pts.forEach((p,i)=>{paths+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="${s.color}"/>`;});});
  let axis=`<line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#e5e7eb"/>
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H-padB}" stroke="#e5e7eb"/>`;
  recs.forEach((r,i)=>{const lbl=(r.date||'').slice(5);axis+=`<text x="${x(i)}" y="${H-padB+18}" font-size="11" fill="#9ca3af" text-anchor="middle">${esc(lbl)}</text>`;});
  for(let g=1;g<4;g++){const yy=padT+g*(H-padT-padB)/4;axis+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#f3f4f6"/>`;}
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:${W}px;">${axis}${paths}</svg>`;
}

function addSeriesRow(s){
  const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap;';
  const typeOpts=TYPES.map(t=>`<option ${s&&s.type===t?'selected':''}>${t}</option>`).join('');
  const fieldOpts=(s&&s.type==='CBC血常规')?['cbc.cHgb','cbc.cPlt','cbc.cHct','cbc.cNeut'].map(f=>`<option ${s.field===f?'selected':''}>${f}</option>`).join(''):'<option>(无)</option>';
  row.innerHTML=`<input class="s-label" placeholder="系列显示名" value="${s?s.label:''}" style="flex:1;min-width:90px;">
    <select class="s-type" style="flex:1;min-width:90px;">${typeOpts}</select>
    <input class="s-color" type="color" value="${s?s.color:'#ed3563'}" style="width:36px;height:36px;padding:2px;">
    <select class="s-field" style="flex:1;min-width:90px;">${fieldOpts}</select>
    <button class="btn ghost" style="color:var(--danger);padding:4px 8px;">✕</button>`;
  row.querySelector('.s-type').onchange=e=>{const fs=row.querySelector('.s-field');
    fs.innerHTML=(e.target.value==='CBC血常规')?['cbc.cHgb','cbc.cPlt','cbc.cHct','cbc.cNeut'].map(f=>`<option>${f}</option>`).join(''):'<option>(无)</option>';};
  row.querySelector('button').onclick=()=>row.remove();
  $('#seriesList').appendChild(row);
}

/* 导入导出 */
function setupIO(){
  $('#btnExportJson').onclick=()=>{download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'医疗记录备份_'+new Date().toISOString().slice(0,10)+'.json');toast('已导出 JSON');};
  $('#btnImport').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);
      if(d&&d.members&&d.records){state=d;save();renderAll();toast('导入成功');}else toast('文件格式不正确');}catch(e){toast('解析失败');}};rd.readAsText(f);};
  $('#btnExportExcel').onclick=()=>{
    const box=$('#expTypes');box.innerHTML=TYPES.map(t=>`<label class="pill" style="cursor:pointer;"><input type="checkbox" class="exp-type" value="${t}" checked> ${t}</label>`).join('');
    openModal('exportModal');};
  $('#btnDoExport').onclick=exportExcel;
  $('#btnUpload').onclick=()=>$('#fileUpload').click();
  $('#fileUpload').onchange=e=>{const m=curMember();if(!m){toast('请先选择成员');return;}
    [...e.target.files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{(m.files=m.files||[]).push({id:uid(),name:f.name,type:f.type,data:rd.result});save();renderFiles();};rd.readAsDataURL(f);});e.target.value='';};
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);}
function exportExcel(){
  const scope=$('#expScope').value;
  const types=[...document.querySelectorAll('.exp-type:checked')].map(c=>c.value);
  const members=scope==='all'?state.members:state.members.filter(m=>m.id===state.current);
  const rows=[['成员','类型','日期','字段1','值1','字段2','值2','字段3','值3','字段4','值4','字段5','值5']];
  const flat=(r)=>{const o={};if(r.trans)o['袋数']=(r.trans.bags||[]).length,o['合计ml']=(r.trans.bags||[]).reduce((a,b)=>a+(+b||0),0);
    if(r.cbc)Object.assign(o,{HGB:r.cbc.cHgb,PLT:r.cbc.cPlt,HCT:r.cbc.cHct,NEUT:r.cbc.cNeut});
    if(r.visit)Object.assign(o,{医生:r.visit.doctor,科室:r.visit.dept,医院:r.visit.hospital});
    if(r.vitals)Object.assign(o,{血压:r.vitals.bp,体温:r.vitals.temp,心率:r.vitals.hr,血氧:r.vitals.spo2});
    if(r.drug)o['药物']=r.drug;if(r.cycle)o['周期']=r.cycle;
    if(r.title)o['标题']=r.title;if(r.src)o['来源']=r.src;if(r.dose)o['剂量']=r.dose;if(r.freq)o['频次']=r.freq;
    if(r.amount)o['金额']=r.amount+(r.currency?(' '+r.currency):'');if(r.item)o['项目']=r.item;
    if(r.note&&!o['备注'])o['备注']=r.note;
    return o;};
  members.forEach(m=>{state.records.filter(r=>r.member===m.id&&types.includes(r.type)).forEach(r=>{
    const o=flat(r);const keys=Object.keys(o);const padded=[];for(let i=0;i<10;i+=2)padded.push(keys[i]||'',keys[i+1]||'');
    rows.push([m.name,r.type,r.date||'',...padded]);});});
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'医疗记录_'+new Date().toISOString().slice(0,10)+'.csv');
  closeModal('exportModal');toast('已导出 CSV');
}

/* 保存记录 */
$('#btnSaveRecord').onclick=()=>{const m=curMember();if(!m){toast('请先选择成员');return;}
  const rec=collectForm();
  if(selType==='输血记录'&&(!rec.trans||!rec.trans.bags.length)){toast('请至少添加一袋');return;}
  if(editingRec){
    Object.assign(editingRec,rec,{id:editingRec.id});
    editingRec=null; $('#btnSaveRecord').textContent='保存记录';
    toast('已更新'); selType='输血记录'; renderSelType();
  } else {
    state.records.push(rec); toast('已保存');
  }
  save(); renderAll(); renderForm();
};

/* 时间线筛选 */
let tlFilter='全部';
function renderTlFilter(){$('#tlFilter').onchange=e=>{tlFilter=e.target.value;renderRecords();};}

/* ===== 初始化 ===== */
function renderAll(){
  $('#curMemberName').textContent=curMember()?curMember().name:'—';
  renderMemberTop();renderFiles();renderStats();renderCharts();renderRecords();
}
function init(){
  applyTheme();setupTheme();setupIO();renderSelType();renderForm();renderTlFilter();renderAll();
}
init();
</script>
